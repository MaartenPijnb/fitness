<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Kracht</title>
<meta name="description" content="Registreer je fitnesssessies en zie je progressie.">
<meta name="theme-color" content="#0a0a12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kracht">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Achtergrond: bewegende aurora waar het glas op refracteert -->
<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="grain"></span>
</div>

<!-- SVG-filter dat de randen van het glas laat 'vloeien' -->
<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.6" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="app" class="app"></div>

<!-- Bottom sheet voor sets loggen, oefening kiezen, etc. -->
<div id="sheet-scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div id="sheet-body" class="sheet-body"></div>
</div>

<!-- Korte meldingen -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<nav id="tabbar" class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
